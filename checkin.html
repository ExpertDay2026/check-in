<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1A3E">
<title>Check-in</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#0A1A3E}
body{overflow-x:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
[hidden]{display:none!important}
#stage{position:relative;width:100%;height:100vh;overflow:hidden;color:#fff}
.cv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.scr{position:absolute;top:0;right:0;bottom:0;left:0;background:#0A1A3E linear-gradient(165deg,#0A1A3E,#16397d);background-position:center;background-repeat:no-repeat}
.e{--tr:translate(-50%,-50%);position:absolute;transform:translate(-50%,-50%);margin:0;text-align:center;font-family:inherit}
button.e,.tab button{border:0;cursor:pointer;font-family:inherit;font-size:inherit;font-weight:inherit}
button.e:disabled{opacity:.6;cursor:not-allowed}
input.e{text-align:left;outline:none}
input.e:focus,button.e:focus-visible,.tab button:focus-visible{box-shadow:0 0 0 calc(var(--u)*.6) rgba(240,214,120,.55)}
.tab{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:calc(var(--u)*.6);background:rgba(255,255,255,.16);border:calc(var(--u)*.3) solid #F0D678;border-radius:calc(var(--u)*3.6);touch-action:pan-y;-webkit-user-select:none;user-select:none}
.tab i{position:absolute;top:calc(var(--u)*.6);bottom:calc(var(--u)*.6);left:calc(var(--u)*.6);width:calc(50% - var(--u)*.6);background:#F0D678;border-radius:calc(var(--u)*3);box-shadow:0 calc(var(--u)*.3) calc(var(--u)*1.2) rgba(0,0,0,.35);transition:transform .28s cubic-bezier(.4,0,.2,1)}
.tab.ext i{transform:translateX(100%)}
.tab.drag i{transition:none}
.tab button{position:relative;z-index:1;background:transparent;color:#fff;transition:color .2s}
.tab button.on{color:#0A1A3E}
@keyframes beat{
0%,70%,100%{transform:var(--tr) scale(1);box-shadow:0 0 0 0 rgba(240,214,120,0),0 0 calc(var(--u)*1.5) rgba(240,214,120,.3)}
12%{transform:var(--tr) scale(1.07);box-shadow:0 0 0 calc(var(--u)*.4) rgba(240,214,120,.55),0 0 calc(var(--u)*5) rgba(240,214,120,.85)}
24%{transform:var(--tr) scale(1);box-shadow:0 0 0 calc(var(--u)*1.6) rgba(240,214,120,0),0 0 calc(var(--u)*2) rgba(240,214,120,.3)}
38%{transform:var(--tr) scale(1.045);box-shadow:0 0 0 calc(var(--u)*.3) rgba(240,214,120,.4),0 0 calc(var(--u)*4) rgba(240,214,120,.65)}
}
.beat{animation:beat 1.6s ease-in-out infinite}
.beat:disabled{animation:none}
@keyframes fl{0%{opacity:0}20%{opacity:.9}100%{opacity:0}}
#flash{position:fixed;top:0;right:0;bottom:0;left:0;z-index:40;background:#fff;pointer-events:none;opacity:0}
#flash.go{animation:fl .75s ease-out}
@media (prefers-reduced-motion:reduce){.beat,.bad{animation:none}#flash.go{animation:none}#conf{display:none}.tab i,.tab button{transition:none}}
@keyframes shake{0%,100%{transform:var(--tr)}20%{transform:var(--tr) translateX(calc(var(--u)*-1.2))}40%{transform:var(--tr) translateX(calc(var(--u)*1.2))}60%{transform:var(--tr) translateX(calc(var(--u)*-.8))}80%{transform:var(--tr) translateX(calc(var(--u)*.8))}}
.bad{border-color:#ff6b6b!important;animation:shake .4s}
#conf{position:fixed;top:0;right:0;bottom:0;left:0;z-index:35;pointer-events:none;overflow:hidden}
#conf i{position:absolute;top:-4%;opacity:0;border-radius:1px;animation:cf 2.2s ease-in forwards}
@keyframes cf{0%{opacity:1;transform:translate(0,0) rotate(0)}85%{opacity:1}100%{opacity:0;transform:translate(var(--dx),110vh) rotate(var(--r))}}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#load{position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0A1A3E;color:rgba(255,255,255,.85);font-size:14px;transition:opacity .3s}
.sp{width:34px;height:34px;border-radius:50%;border:3px solid rgba(240,214,120,.25);border-top-color:#F0D678;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="load" role="status"><div class="sp"></div><div>Loading…</div></div>
<div id="flash"></div>
<div id="conf"></div>
<script>/* pengaman: layar "Loading" tidak boleh menutup halaman selamanya */
function _nl(){var l=document.getElementById("load");if(l)l.style.display="none"}
addEventListener("error",_nl);setTimeout(_nl,20000);</script>
<noscript><p style="color:#fff;text-align:center;font:16px system-ui;padding:24px">Enable JavaScript to check in.</p></noscript>
<script src="config-checkin.js"></script>
<script>
(function(){
var A=window.APP||{}, D=A.DESIGN||{}, LD=D.landscape||{}, LF=LD.form||{}, LO=LD.success||{};
var API=A.CHECKIN_API_URL||A.API_URL||'', apiOk=/^https:\/\/script\.google\.com\/.+\/exec$/.test(API);
var stage=document.getElementById('stage'), DW=D.width||1080, DH=D.height||1920, LW=LD.width||1920, LH=LD.height||1080, F=D.form||{}, O=D.success||{};
var screens=[], texts=[], lastW=0, tab='internal', _cx, land=false, sending=false, offShown=false;
document.documentElement.style.background=document.body.style.background=D.letterbox||'#0A1A3E';
stage.style.fontFamily=D.font||'system-ui,sans-serif'; stage.style.color=D.color||'#fff';

var fontsReady=Promise.resolve();
if(D.fontUrl){
  var lk=document.createElement('link'); lk.rel='stylesheet'; lk.href=D.fontUrl;
  fontsReady=new Promise(function(ok){
    lk.onload=function(){var f=document.fonts,ff=D.font||'sans-serif'; f&&f.load?Promise.all([f.load('500 1em '+ff),f.load('700 1em '+ff)]).then(ok,ok):ok();};
    lk.onerror=ok;
  });
  document.head.appendChild(lk);
}
function hideLoad(){var l=document.getElementById('load');if(!l)return;l.style.opacity='0';setTimeout(function(){if(l.parentNode)l.parentNode.removeChild(l);},350);}

/* Portrait: kanvas 1080x1920 (gambar 1080x2520, bleed atas/bawah). Landscape: kanvas 1920x1080 (gambar 2520x1080, bleed kiri/kanan).
   --u = 1% lebar desain portrait, dipakai di kedua orientasi, jadi 'size' di config berlaku sama. */
function fit(){
  var de=document.documentElement,a=document.activeElement,VW=de.clientWidth||innerWidth||360;
  if(a&&a.tagName==='INPUT'&&VW===lastW)return; // keyboard Android jangan mengubah tata letak
  lastW=VW; var VH=innerHeight||de.clientHeight||640; stage.style.height=VH+'px';
  var was=land; land=VW>VH*1.1; if(land!==was)arrange();
  screens.forEach(function(s){
    var b=s.bleed,dw=s.dw,dh=s.dh,kw=VW/dw,kh=VH/dh,k;
    if(s.hz)k=kh<=kw?Math.max(kh,VW/(dw+2*b)):kw; else k=kw<=kh?Math.max(kw,VH/(dh+2*b)):kh;
    s.style.setProperty('--u',(DW*k/100)+'px');
    s.cv.style.width=(dw*k)+'px'; s.cv.style.height=(dh*k)+'px';
    if(s.art)s.style.backgroundSize=s.hz?((dw+2*b)*k)+'px '+(dh*k)+'px':(dw*k)+'px '+((dh+2*b)*k)+'px';
  });
  texts.forEach(shrink);
}
var u=function(n){return 'calc(var(--u) * '+n+')';};

function pos(e,c){ // posisi & ukuran huruf sesuai orientasi
  var s=e.style; e._c=c; s.left=c.x+'%'; s.top=c.y+'%'; s.width=c.w?c.w+'%':''; s.whiteSpace='';
  if(c.size)s.fontSize=e.tagName==='INPUT'?'max(16px,'+u(c.size)+')':u(c.size); // 16px: cegah zoom otomatis iOS
}
function mk(sc,tag,def,over,lo){ // lo = posisi khusus  (x, y, w, h)
  if(over===false)return null;
  var c=Object.assign({},def,over),e=document.createElement(tag),s=e.style;
  e.className='e'; e._cp=c; e._cl=Object.assign({},c,lo);
  if(c.weight)s.fontWeight=c.weight;
  if(c.color)s.color=c.color;
  if(c.font)s.fontFamily=c.font;
  if(c.lineHeight)s.lineHeight=c.lineHeight;
  if(c.letterSpacing)s.letterSpacing=u(c.letterSpacing);
  if(c.uppercase)s.textTransform='uppercase';
  if(c.italic)s.fontStyle='italic';
  if(c.shadow)s.textShadow=c.shadow;
  if(c.align)s.textAlign=c.align;
  if(c.bg)s.background=c.bg;
  if(c.radius!=null)s.borderRadius=u(c.radius);
  if(c.pad!=null)s.padding=u(c.pad)+' '+u(c.pad*1.6);
  if(c.border)s.border=u(.3)+' solid '+c.border;
  if(c.teks)e.textContent=c.teks;
  if(c.placeholder){e.placeholder=c.placeholder;e.setAttribute('aria-label',c.placeholder);}
  pos(e,c);
  if(c.h||c.lines>1||e._cl.h||e._cl.lines>1)texts.push(e);
  sc.cv.appendChild(e); return e;
}
function mkScreen(c,hz){
  var sc=document.createElement('section'),cv=document.createElement('div');
  sc.className='scr'; sc.hidden=true; cv.className='cv'; sc.appendChild(cv); sc.cv=cv; sc.hz=!!hz;
  sc.dw=hz?LW:DW; sc.dh=hz?LH:DH; sc.art=!!c.bg; sc.bleed=c.bg?Math.max(0,+c.bleed||0):0; sc.ready=Promise.resolve();
  if(c.bg){
    sc.style.backgroundImage='url("'+c.bg+'")'; sc.style.backgroundColor=D.letterbox||'#0A1A3E';
    sc.ready=new Promise(function(ok){ // bleed otomatis dari ukuran gambar bila 'bleed' tidak diisi
      var im=new Image(); im.onerror=ok;
      im.onload=function(){
        if(c.bleed==null&&im.naturalWidth){sc.bleed=Math.max(0,(hz?im.naturalWidth*LH/im.naturalHeight-LW:im.naturalHeight*DW/im.naturalWidth-DH)/2);fit();}
        ok();
      };
      im.src=c.bg;
    });
  }
  stage.appendChild(sc); screens.push(sc); return sc;
}

/* teks: nama panjang dipecah 2 baris seimbang & dikecilkan; 'h' = tinggi maksimum (% tinggi desain) */
function shrink(el){
  var c=el._c,cv=el.parentNode,H=cv.clientHeight,W=el.clientWidth; if(!c||!H||!W)return;
  if(c.lines>1)return fitName(el,c,H,W);
  if(!c.h)return;
  var maxH=H*c.h/100,n=c.size||4,lo=c.min||n*.5; el.style.fontSize=u(n);
  while(el.scrollHeight>maxH+1&&n>lo){n=Math.max(lo,n-.25);el.style.fontSize=u(n);}
}
function fitName(el,c,H,W){
  var full=el._full&&el.textContent.replace(/\n/g,' ')===el._full?el._full:(el._full=el.textContent.replace(/\s+/g,' ').trim());
  var base=c.size||4,lo=c.min||base*.5;
  el.textContent=full; el.style.whiteSpace='nowrap'; el.style.top=c.y+'%'; el.style.fontSize=u(base);
  var bottom=c.y/100*H+el.offsetHeight/2;
  if(el.scrollWidth<=W+1){el.style.whiteSpace='';return;}
  var words=full.split(' ');
  if(words.length>1){
    var cx=_cx||(_cx=document.createElement('canvas').getContext('2d')),cs=getComputedStyle(el);
    cx.font=cs.fontStyle+' '+cs.fontWeight+' '+cs.fontSize+' '+cs.fontFamily;
    var best=1,bw=Infinity;
    for(var i=1;i<words.length;i++){var w=Math.max(cx.measureText(words.slice(0,i).join(' ')).width,cx.measureText(words.slice(i).join(' ')).width);if(w<bw){bw=w;best=i;}}
    el.textContent=words.slice(0,best).join(' ')+'\n'+words.slice(best).join(' ');
  }
  el.style.whiteSpace='pre';
  var maxH=c.h?H*c.h/100:Infinity,n=base;
  while((el.scrollWidth>W+1||el.offsetHeight>maxH+1)&&n>lo){n=Math.max(lo,n-.25);el.style.fontSize=u(n);}
  if(el.scrollWidth>W+1)el.style.whiteSpace='pre-line';
  el.style.top=c.y2!=null?c.y2+'%':(bottom-el.offsetHeight/2)+'px';
}

/* ---------- layar: portrait (sF, sO) dan  (sFL, sOL) ---------- */
var sF=mkScreen(F),sO=mkScreen(O),sFL=mkScreen(LF,true),sOL=mkScreen(LO,true),SH='0 1px 8px rgba(0,0,0,.55)';
var FIELD=Object.assign({bg:'rgba(255,255,255,.95)',color:'#0A1A3E',border:'#F0D678',radius:2.4,pad:2.2,size:4,weight:500},F.field);
var BTN={size:5,weight:700,color:'#0A1A3E',bg:'#F0D678',radius:3.2,pad:2.4};
var TB=Object.assign({x:50,y:42,w:80,size:4,weight:700,teksInternal:'Internal',teksExternal:'External'},F.tab);
var L=function(d,o){return Object.assign(d,o);};
var tb=mk(sF,'div',{x:TB.x,y:TB.y,w:TB.w,size:TB.size,weight:TB.weight},undefined,L({x:68.75,y:33.4,w:50},LF.tab)); tb.classList.add('tab');
var th=document.createElement('i'),bI=document.createElement('button'),bE=document.createElement('button'); // th = tombol emas yang meluncur
tb.setAttribute('role','radiogroup'); tb.style.borderColor=FIELD.border||'#F0D678'; tb.appendChild(th);
[[bI,TB.teksInternal],[bE,TB.teksExternal]].forEach(function(p){
  var b=p[0]; b.type='button'; b.textContent=p[1]; b.setAttribute('role','radio'); b.style.padding=u(1)+' '+u(1);
  tb.appendChild(b);
});
var iK=mk(sF,'input',Object.assign({},FIELD,{x:50,y:50,w:80,placeholder:'NPK (6 digits)'}),F.npk,L({x:68.75,y:45.6,w:50},LF.npk));
var iN=mk(sF,'input',Object.assign({},FIELD,{x:50,y:50,w:80,placeholder:'Full Name'}),F.nama,L({x:55.9,y:45.6,w:24.4},LF.nama));
var iC=mk(sF,'input',Object.assign({},FIELD,{x:50,y:58,w:80,placeholder:'Company'}),F.company,L({x:81.6,y:45.6,w:24.4},LF.company));
var ND=+(F.npk&&F.npk.digits)||0; // digits: 6 => hanya angka, tepat 6 digit
iK.type=iN.type=iC.type='text'; iK.autocomplete='off'; iK.autocapitalize='characters'; iK.maxLength=ND||30;
iK.setAttribute('inputmode',ND?'numeric':((F.npk&&F.npk.inputmode)||'text'));
iN.autocomplete='name'; iN.maxLength=80; iC.autocomplete='organization'; iC.maxLength=80;
iK.setAttribute('enterkeyhint','go'); iN.setAttribute('enterkeyhint','next'); iC.setAttribute('enterkeyhint','go');
var bT=mk(sF,'button',Object.assign({x:50,y:69,w:62,teks:'Check-in'},BTN),F.tombol,L({x:68.75,y:59.3,w:50},LF.tombol)); bT.type='button'; bT.classList.add('beat');
var eE=mk(sF,'div',{x:50,y:76,w:80,size:3.4,weight:500,color:'#ffb4b4',lineHeight:1.3,shadow:SH},F.pesan,L({x:68.75,y:69.9,w:50},LF.pesan));
var lbT=bT.textContent;

var sN=mk(sO,'div',{x:50,y:54,w:77,h:9.2,size:8,weight:700,lineHeight:1.1,lines:2,min:3.5},O.nama,L({x:74,y:44,w:39.6,h:17},LO.nama));
var sD=mk(sO,'div',{x:50,y:60,w:84,h:6,size:5,weight:500,color:'#F0D678',min:3.2},O.divisi,L({x:74,y:57,w:40,h:7},LO.divisi));
var sW=mk(sO,'div',{x:50,y:68,size:4,weight:500,color:'rgba(255,255,255,.88)'},O.waktu,L({x:74,y:67},LO.waktu));
var sC=mk(sO,'div',{x:50,y:73,w:80,size:3.4,weight:500,color:'#F0D678'},O.catatan,L({x:74,y:75,w:40},LO.catatan));

/* elemen yang sama dipindah antara kanvas portrait dan landscape (isian tidak terduplikasi) */
var formEls=[tb,iK,iN,iC,bT,eE],okEls=[sN,sD,sW,sC].filter(Boolean),curS=sF;
function arrange(){
  var ok=curS===sO;
  [[formEls,land?sFL:sF],[okEls,land?sOL:sO]].forEach(function(p){
    p[0].forEach(function(e){if(e.parentNode!==p[1].cv)p[1].cv.appendChild(e);pos(e,land?e._cl:e._cp);});
  });
  sF.hidden=land||ok; sO.hidden=land||!ok; sFL.hidden=!land||ok; sOL.hidden=!land||!ok;
}
function show(s){curS=s;arrange();}
/* pesan galat: field terkait bergetar & bergaris merah supaya terlihat */
function err(m,els){
  eE.textContent=m||'';
  [iK,iN,iC].forEach(function(i){i.classList.remove('bad');});
  if(m&&els)els.forEach(function(i){void i.offsetWidth;i.classList.add('bad');});
}
function offline(){return navigator.onLine===false;}
function busy(on){sending=on;bT.disabled=on||offline();bT.textContent=on?'Sending…':lbT;}
function net(){ // tombol mati & pesan jelas saat HP offline; pulih sendiri saat sinyal kembali
  bT.disabled=sending||offline();
  if(offline()){err('No internet connection. Connect first, then press Check-in.');offShown=true;}
  else if(offShown){err('');offShown=false;}
}
addEventListener('online',net); addEventListener('offline',net);
function confetti(){ // semburan konfeti emas saat berhasil
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  var c=document.getElementById('conf'),cols=['#F0D678','#d4af37','#ffe699','#ffffff','#3fa9ff'];
  for(var i=0;i<44;i++){
    var p=document.createElement('i'),q=p.style;
    q.left=Math.random()*100+'%'; q.background=cols[i%cols.length];
    q.width=(6+Math.random()*7)+'px'; q.height=(10+Math.random()*10)+'px';
    q.animationDuration=(1.6+Math.random()*1.4)+'s'; q.animationDelay=(Math.random()*.35)+'s';
    q.setProperty('--r',(Math.random()*720-360)+'deg'); q.setProperty('--dx',(Math.random()*160-80)+'px');
    c.appendChild(p);
  }
  setTimeout(function(){c.textContent='';},3800);
}

function setTab(t){
  tab=t; iK.hidden=t!=='internal'; iN.hidden=iC.hidden=t==='internal'; err('');
  tb.classList.toggle('ext',t==='external');
  [[bI,'internal'],[bE,'external']].forEach(function(p){var on=t===p[1];p[0].classList.toggle('on',on);p[0].setAttribute('aria-checked',on);});
}
bI.onclick=function(){setTab('internal');}; bE.onclick=function(){setTab('external');};
tb.onkeydown=function(e){if(e.key==='ArrowLeft')setTab('internal');else if(e.key==='ArrowRight')setTab('external');};
/* geser (swipe) tombol emas; ketukan di salah satu sisi tetap bekerja */
var dg=null,dragged=false;
tb.addEventListener('pointerdown',function(e){dg={x:e.clientX,s:tab==='external'?th.offsetWidth:0,m:false};});
tb.addEventListener('pointermove',function(e){
  if(!dg)return; var dx=e.clientX-dg.x;
  if(!dg.m){if(Math.abs(dx)<6)return;dg.m=true;tb.classList.add('drag');try{tb.setPointerCapture(e.pointerId);}catch(x){}}
  th.style.transform='translateX('+Math.max(0,Math.min(th.offsetWidth,dg.s+dx))+'px)';
});
function dragEnd(e){
  if(!dg)return; var d=dg; dg=null; if(!d.m)return;
  dragged=true; setTimeout(function(){dragged=false;},60);
  tb.classList.remove('drag'); th.style.transform='';
  setTab(d.s+(e.clientX-d.x)>th.offsetWidth/2?'external':'internal');
}
tb.addEventListener('pointerup',dragEnd); tb.addEventListener('pointercancel',dragEnd);
tb.addEventListener('click',function(e){if(dragged){e.stopPropagation();e.preventDefault();}},true);

function api(a,args){
  var ac=new AbortController(),tm=setTimeout(function(){ac.abort();},30000);
  return fetch(API,{method:'POST',signal:ac.signal,headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({a:a,args:args||[]})})
    .then(function(r){clearTimeout(tm);return r.text();})
    .then(function(t){try{return JSON.parse(t);}catch(e){throw new Error('The server did not return data. Make sure the Apps Script deployment access is set to Anyone.');}})
    .then(function(j){
      if(!j.ok){var er=new Error(j.error||'Failed to contact the server'); er.retry=/padat|busy/i.test(er.message); throw er;} // server padat: boleh dicoba lagi otomatis
      return j.data;
    })
    .catch(function(e){
      if(e&&e.name==='AbortError')throw new Error('Slow connection. Press Check-in again: your data will not be recorded twice.');
      if(e&&e.name==='TypeError'){var er=new Error('No internet connection. Please refresh the page and try again.'); er.retry=true; throw er;}
      throw e;
    });
}

function done(r){
  sN.textContent=r.nama; sD.textContent=r.bagian; sW.textContent='At '+r.waktu+ ' WIB';
  if(sC)sC.textContent=r.again?'You have already checked in before.':'';
  show(sO); texts.forEach(shrink);
  var f=document.getElementById('flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); // kilat
  confetti();
}
function buzz(){if(A.VIBRATE&&navigator.vibrate)try{navigator.vibrate(A.VIBRATE);}catch(e){}}

function send(body,n){ // coba lagi otomatis (maks 2x) bila server padat / sinyal putus; aman karena server menolak data ganda
  return api('checkin',body).catch(function(e){
    if(n<2&&e&&e.retry)return new Promise(function(r){setTimeout(r,1200*(n+1));}).then(function(){return send(body,n+1);});
    throw e;
  });
}
function submit(){
  if(sending||offline())return;
  err(''); var body;
  if(tab==='internal'){
    var k=iK.value.trim(); if(!k)return err('NPK is required.',[iK]);
    if(ND&&k.length!==ND)return err('NPK must be '+ND+' digits.',[iK]);
    body=['internal',k];
  }else{
    var n=iN.value.trim(),c=iC.value.trim();

}
